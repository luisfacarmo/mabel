[workspace]
resolver = "2"
members = [
    "crates/mabel-protocol",
    "crates/mabel-transport",
    "crates/mabel-core",
]

[workspace.package]
version = "0.1.0"
authors = ["Luis Carmo <luis.f.carmo@icloud.com>"]
license = "MIT"
edition = "2021"
repository = "https://github.com/luisfacarmo/mabel"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
opt-level = "s"
strip = true
