[package]
name = "mabel-app"
version = "0.1.0"
description = "Mabel - Desktop companion for Soundcore headphones"
authors = ["Luis Carmo <luis.f.carmo@icloud.com>"]
edition = "2021"

[lib]
name = "mabel_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mabel-transport = { path = "../../../crates/mabel-transport" }

[features]
custom-protocol = ["tauri/custom-protocol"]

